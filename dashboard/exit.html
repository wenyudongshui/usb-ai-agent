<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USB AI Agent · 退出</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="login-wrap">
  <div class="card login-card">
    <h1>🔒 USB AI Agent</h1>
    <div id="state" class="banner info">正在退出并清理本机残留…</div>
    <p id="detail" class="muted"></p>
    <div class="center mt">
      <button id="btnDone" class="btn hidden">完成，关闭页面</button>
    </div>
  </div>
</div>

<script>
  const done = new URLSearchParams(location.search).get('done') === '1';
  document.getElementById('state').className = 'banner ' + (done ? 'ok' : 'info');
  document.getElementById('state').textContent = done
    ? '会话已保存并安全退出，本机残留已清理。'
    : '已不保存退出，本机残留已清理。';
  document.getElementById('detail').innerHTML =
    '你可以安全拔出 U 盘。<br>如需再次清理残留，可运行 U 盘根目录的 <b>clean.bat</b>（Windows）或 <b>clean.sh</b>（mac/Linux）。<br><br>' +
    '页面不再与服务器连接——服务进程已停止。';
  const b = document.getElementById('btnDone');
  b.classList.remove('hidden');
  b.addEventListener('click', () => window.close());
</script>
</body>
</html>
