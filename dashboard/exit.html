<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USB AI Agent · 退出</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="login-wrap">
  <div class="card login-card">
    <h1>🔒 USB AI Agent</h1>
    <div id="state" class="banner info">正在退出…</div>
    <p id="detail" class="muted"></p>
    <div class="center mt">
      <button id="btnDone" class="btn hidden">完成，关闭页面</button>
    </div>
  </div>
</div>

<script>
  const mode = new URLSearchParams(location.search).get('mode') || 'wipe';
  const el = document.getElementById('state');
  el.className = 'banner ok';
  if (mode === 'wipe') {
    el.textContent = '已全部删除退出（本机残留与全部账号/档案/密钥数据已清除）。';
    document.getElementById('detail').innerHTML = '本机与 U 盘数据均已被清理，可安全拔出。';
  } else {
    el.textContent = '已保留本次在本机的全部更改，其余数据全部清除。';
    document.getElementById('detail').innerHTML = '本机本次会话产生的更改已保留；账号/档案/密钥等其余数据已清除。可拔出 U 盘。';
  }
  const b = document.getElementById('btnDone');
  b.classList.remove('hidden');
  b.addEventListener('click', () => window.close());
</script>
</body>
</html>
