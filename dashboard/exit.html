<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USB AI Agent · 退出</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="login-wrap">
  <div class="card login-card">
    <h1>USB AI Agent</h1>
    <div id="state" class="banner ok">已安全退出。</div>
    <p id="detail" class="muted"></p>
    <div class="center mt">
      <button id="btnDone" class="btn">完成，关闭页面</button>
    </div>
  </div>
</div>

<script>
  document.getElementById('detail').innerHTML =
    '本机残留已清理，账号 / 智能体 / 工作人格数据均保留在 U 盘。<br>可拔出 U 盘。';
  document.getElementById('btnDone').addEventListener('click', () => window.close());
</script>
</body>
</html>
