<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USB AI Agent</title>
<link rel="stylesheet" href="/styles.css">
<style>
  .login-layout { display:flex; min-height:100vh; }
  .sidebar { width:210px; background:#1f2937; color:#fff; padding:18px 12px; display:flex; flex-direction:column; gap:8px; }
  .sidebar h1 { font-size:15px; margin:0 10px 12px; }
  .account { padding:10px 14px; border-radius:10px; cursor:pointer; }
  .account:hover { background:#374151; }
  .account.selected { background:#2e74b5; }
  .addbtn { border:1px dashed #4b5563; color:#d1d5db; text-align:center; padding:11px; border-radius:10px; cursor:pointer; font-size:13px; }
  .addbtn:hover { border-color:#9ca3af; color:#fff; }
  .main-area { flex:1; display:flex; align-items:center; justify-content:center; padding:24px; }
  .login-card { width:340px; }
  .login-card h2 { font-size:17px; margin:0 0 16px; }
  .login-card input { width:100%; box-sizing:border-box; padding:10px 12px; margin-bottom:12px; border:1px solid #d1d5db; border-radius:8px; font-size:14px; }
  .login-card button { width:100%; padding:10px; background:#2e74b5; color:#fff; border:none; border-radius:8px; font-size:14px; }
  .err { margin-top:12px; font-size:13px; color:#dc2626; min-height:16px; }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="login-layout">
  <aside class="sidebar">
    <h1>USB AI Agent</h1>
    <div class="addbtn" id="btnAdd">＋ 新增账号</div>
    <div id="accountList"></div>
  </aside>

  <div class="main-area">
    <div class="card login-card" id="panel">
      <div id="loginBox" class="hidden">
        <h2 id="loginName"></h2>
        <input type="password" id="pw" placeholder="密码" autocomplete="current-password">
        <button id="btnLogin">登录</button>
        <div class="err" id="msgLogin"></div>
      </div>

      <div id="addBox">
        <h2>新增账号</h2>
        <input type="text" id="a_name" placeholder="账号名" autocomplete="username">
        <input type="password" id="a_pw1" placeholder="密码（8位以上，含大小写数字）" autocomplete="new-password">
        <input type="password" id="a_pw2" placeholder="确认密码" autocomplete="new-password">
        <button id="btnAddOk">创建并进入</button>
        <div class="err" id="msgAdd"></div>
      </div>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let users = [];

async function postJSON(url, body) {
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
  return { r, j: await r.json().catch(() => ({})) };
}

async function loadUsers() {
  const { j } = await (await fetch('/api/users')).json();
  users = j.users || [];
  renderAccounts();
  if (users.length) selectAccount(null, users[0]);   // default to first account
  else showAdd();
}

function renderAccounts() {
  const box = $('accountList');
  box.innerHTML = '';
  for (const u of users) {
    const el = document.createElement('div');
    el.className = 'account' + ($('loginName').textContent === u ? ' selected' : '');
    el.textContent = u;
    el.onclick = () => selectAccount(u);
    box.appendChild(el);
  }
}

function selectAccount(name) {
  $('loginName').textContent = name;
  $('loginBox').classList.remove('hidden');
  $('addBox').classList.add('hidden');
  $('pw').value = ''; $('msgLogin').textContent = '';
  renderAccounts();
}

function showAdd() {
  $('loginBox').classList.add('hidden');
  $('addBox').classList.remove('hidden');
  $('a_name').value = $('a_pw1').value = $('a_pw2').value = ''; $('msgAdd').textContent = '';
  renderAccounts();
}

loadUsers();
// refresh the list when returning via back/forward cache
window.addEventListener('pageshow', loadUsers);

$('btnAdd').addEventListener('click', showAdd);
$('btnLogin').addEventListener('click', async () => {
  const msg = $('msgLogin'); msg.textContent = '';
  const { r, j } = await postJSON('/api/login', { username: $('loginName').textContent, password: $('pw').value });
  if (r.ok) window.location.href = j.redirect || '/main.html';
  else msg.textContent = j.error || '登录失败';
});
$('btnAddOk').addEventListener('click', async () => {
  const msg = $('msgAdd'); msg.textContent = '';
  const name = $('a_name').value.trim(), pw1 = $('a_pw1').value, pw2 = $('a_pw2').value;
  if (!name) { msg.textContent = '请填写账号名'; return; }
  if (pw1 !== pw2) { msg.textContent = '两次输入的密码不一致'; return; }
  const { r } = await postJSON('/api/users', { username: name, password: pw1 });
  if (!r.ok) return (msg.textContent = '创建失败');
  await loadUsers();          // refresh the account list immediately
  const lr = await postJSON('/api/login', { username: name, password: pw1 });
  if (lr.r.ok) window.location.href = lr.j.redirect || '/main.html';
  else selectAccount(name);
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  $('loginBox').classList.contains('hidden') ? $('btnAddOk').click() : $('btnLogin').click();
});
</script>
</body>
</html>
