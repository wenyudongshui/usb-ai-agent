<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USB AI Agent</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="login-wrap">
  <div class="card login-card">
    <h1>USB AI Agent</h1>
    <div id="unclean" class="banner warn hidden">上次非正常退出，已自动补清理本机残留。</div>
    <div id="tip" class="muted" style="margin-bottom:14px;font-size:13px"></div>
    <input type="text" id="a_name" placeholder="账号名" autocomplete="username">
    <input type="password" id="a_pw" placeholder="密码" autocomplete="current-password">
    <button id="btnGo">进入</button>
    <div id="msg" class="err" style="margin-top:12px;font-size:13px;color:#dc2626;min-height:16px"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let needsSetup = false;

async function init() {
  try {
    const s = await (await fetch('/api/session', { cache: 'no-store' })).json();
    if (s.unclean) $('unclean').classList.remove('hidden');
    needsSetup = !!s.needsSetup;
    $('tip').textContent = needsSetup ? '首次使用 · 设置账号（账号名 + 密码，无需确认）' : '登录';
    $('btnGo').textContent = needsSetup ? '设置并进入' : '登录';
    $('a_pw').placeholder = needsSetup ? '设置密码（8位以上，含大小写数字）' : '密码';
    $('a_name').focus();
  } catch {}
}
init();
// re-check on back/forward-cache re-entry (USB replug / exit and re-enter)
window.addEventListener('pageshow', init);

async function go() {
  const msg = $('msg'); msg.textContent = '';
  const name = $('a_name').value.trim(), pw = $('a_pw').value;
  if (!name || !pw) { msg.textContent = '请输入账号名与密码'; return; }
  const post = (u, b) => fetch(u, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b) });
  if (needsSetup) {
    const r = await post('/api/users', { username: name, password: pw });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { msg.textContent = j.error || '设置失败'; return; }
  }
  const r = await post('/api/login', { username: name, password: pw });
  const j = await r.json().catch(() => ({}));
  if (r.ok) window.location.href = j.redirect || '/main.html';
  else msg.textContent = j.error || '登录失败';
}

$('btnGo').addEventListener('click', go);
$('a_pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
</script>
</body>
</html>
