<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USB AI Agent · 登录</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="login-wrap">
  <div class="card login-card">
    <h1>🔒 USB AI Agent</h1>

    <div id="unclean" class="banner warn hidden">
      检测到上次为非正常退出，已自动补清理本机残留。<br>如仍有残留，可运行 U 盘根目录的 <b>clean.bat</b>（或 clean.sh）再次清理。
    </div>

    <!-- 首次设置密码 -->
    <div id="setup">
      <p class="sub">首次使用 · 设置初始密码</p>
      <input type="password" id="pw1" placeholder="新密码（8位以上，含大小写与数字）">
      <input type="password" id="pw2" placeholder="确认密码">
      <ul class="rules">
        <li>至少 8 位</li>
        <li>包含大写字母、小写字母和数字</li>
      </ul>
      <button id="btnSetup">设置密码并进入</button>
      <div id="msgSetup"></div>
    </div>

    <!-- 登录 -->
    <div id="login" class="hidden">
      <p class="sub">输入密码登录</p>
      <input type="password" id="pw" placeholder="密码" autocomplete="current-password">
      <button id="btnLogin">登 录</button>
      <div id="msgLogin"></div>
    </div>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);

  function showMsg(el, text, ok) {
    el.style.color = ok ? '#16a34a' : '#dc2626';
    el.textContent = text || '';
  }

  async function postJSON(url, body) {
    const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    return { r, j: await r.json().catch(() => ({})) };
  }

  (async () => {
    try {
      // unclean flag is surfaced without auth
      const s = await (await fetch('/api/session')).json();
      if (s.unclean) $('unclean').classList.remove('hidden');
      const st = await (await fetch('/api/setup')).json();
      if (st.needsSetup) { $('setup').classList.remove('hidden'); $('login').classList.add('hidden'); }
      else { $('setup').classList.add('hidden'); $('login').classList.remove('hidden'); }
    } catch (e) {
      chooseLogin();
    }
  })();

  function chooseLogin() {
    $('setup').classList.add('hidden');
    $('login').classList.remove('hidden');
  }

  $('btnSetup').addEventListener('click', async () => {
    const msg = $('msgSetup'); showMsg(msg, '');
    const password = $('pw1').value, password2 = $('pw2').value;
    const { r, j } = await postJSON('/api/setup', { password, password2 });
    if (r.ok) window.location.href = j.redirect || '/main.html';
    else showMsg(msg, j.error || '设置失败');
  });

  $('btnLogin').addEventListener('click', async () => {
    const msg = $('msgLogin'); showMsg(msg, '');
    const { r, j } = await postJSON('/api/login', { password: $('pw').value });
    if (r.ok) window.location.href = j.redirect || '/main.html';
    else showMsg(msg, j.error || '登录失败');
  });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    const s = $('setup').classList.contains('hidden');
    s ? $('btnLogin').click() : $('btnSetup').click();
  });
</script>
</body>
</html>
