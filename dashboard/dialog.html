<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USB AI Agent · 对话框</title>
<link rel="stylesheet" href="/styles.css">
<style>
  body { display:flex; flex-direction:column; height:100vh; }
  #messages { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:84%; padding:9px 13px; border-radius:12px; line-height:1.65; font-size:14px; white-space:pre-wrap; word-break:break-word; }
  .msg.user { align-self:flex-end; background:#2e74b5; color:#fff; border-bottom-right-radius:3px; }
  .msg.assistant { align-self:flex-start; background:#f3f4f6; color:#1f2937; border-bottom-left-radius:3px; }
  .msg.error { align-self:center; background:#fee2e2; color:#991b1b; font-size:13px; max-width:95%; }
  .toolbox { align-self:stretch; background:#f9fafb; border:1px solid #e5e7eb; border-radius:10px; padding:10px 12px; font-size:13px; }
  .toolbox .name { font-weight:600; color:#374151; }
  .toolbox pre { margin:6px 0 0; font-size:12px; color:#6b7280; white-space:pre-wrap; max-height:140px; overflow:auto; }
  #approval { position:fixed; inset:0; background:rgba(17,24,39,.55); display:none; align-items:center; justify-content:center; z-index:20; }
  #approval .box { background:#fff; border-radius:14px; padding:20px; width:min(520px,92vw); max-height:70vh; overflow:auto; }
  #approval h3 { margin:0 0 8px; font-size:15px; }
  #approval pre { background:#f9fafb; padding:10px; border-radius:8px; font-size:12px; white-space:pre-wrap; max-height:200px; overflow:auto; }
  .question-row { margin:8px 0; }
  .question-row label { display:block; font-size:13px; color:#374151; margin-bottom:4px; }
  .question-row input { width:100%; padding:8px; border:1px solid #d1d5db; border-radius:8px; }
  #statusline { padding:4px 16px; font-size:12px; color:#6b7280; min-height:20px; }
</style>
</head>
<body>
<header>
  <h1>💬 对话框模式</h1>
  <span id="meta" class="badge"></span>
  <div class="spacer"></div>
  <button id="btnCancel">取消本轮</button>
  <button id="btnBack">← 返回控制台</button>
</header>

<div id="messages"></div>

<div class="composer" style="padding:10px 16px;border-top:1px solid #e5e7eb;background:#fff">
  <select id="perm" title="权限模式" style="max-width:150px">
    <option value="default">默认</option>
    <option value="acceptEdits">自动接受编辑</option>
    <option value="bypassPermissions">无限制</option>
  </select>
  <textarea id="input" rows="2" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
  <button id="btnSend">发 送</button>
</div>
<div id="statusline"></div>

<div id="approval">
  <div class="box">
    <h3 id="approvalTitle">等待你的审批…</h3>
    <div id="approvalBody"></div>
    <div class="form-row" style="margin-top:12px">
      <button class="btn" id="btnAllow">允许</button>
      <button class="btn ghost" id="btnDeny">拒绝</button>
    </div>
    <div id="approvalMsg" class="muted" style="font-size:12px;margin-top:8px"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let pendingRequestId = null;
let pendingTool = null;
let answering = [];

async function jget(url) { const r = await fetch(url); return { r, j: await r.json().catch(() => ({})) }; }
async function postJSON(url, body) { const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) }); return { r, j: await r.json().catch(() => ({})) }; }

function addMsg(role, content, cls) {
  const el = document.createElement('div');
  el.className = 'msg ' + (cls || role);
  el.textContent = content;
  $('messages').appendChild(el);
  el.scrollIntoView({ block: 'end' });
  return el;
}

async function guard() {
  const { j } = await jget('/api/session');
  if (!j.authed) { window.location.href = '/login.html'; return false; }
  return true;
}

async function loadInfo() {
  const { j } = await jget('/api/dialog/info');
  $('meta').textContent = j.agent ? `${j.agent.name} · ${j.agent.model} ｜ 人格: ${j.persona?.name || '(未选)'}` : '未配置智能体';
  if (!j.engineInstalled) { addMsg('error', '引擎未安装。请返回控制台「环境检查 → 确认安装」后再来。', 'error'); }
  if (!j.agent) { addMsg('error', '尚未选择智能体。请返回控制台在「智能体」中选择一个。', 'error'); }
  if (!j.persona) { addMsg('error', '尚未选择工作人格。请返回控制台在「工作人格」中选择一个。', 'error'); }
}

function showApproval(tool, input) {
  pendingRequestId = null; pendingTool = tool; answering = [];
  $('approvalTitle').textContent = `工具调用：${tool}`;
  $('approvalBody').innerHTML = `<pre>${escapeHTML(JSON.stringify(input, null, 2) || '{}')}</pre>`;
  $('approval').style.display = 'flex';
}
function showQuestions(questions) {
  pendingTool = 'AskUserQuestion'; answering = [];
  $('approvalTitle').textContent = 'Claude Code 向你提问';
  $('approvalBody').innerHTML = '';
  for (const q of questions) {
    const row = document.createElement('div');
    row.className = 'question-row';
    row.innerHTML = `<label>${escapeHTML(q.question)}${q.choices?.length ? `（可选项：${q.choices.map((c) => c.label).join(' / ')}）` : ''}</label><input data-q="${escapeHTML(q.question)}">`;
    $('approvalBody').appendChild(row);
    answering.push(row.querySelector('input'));
  }
  $('approval').style.display = 'flex';
}
function escapeHTML(s) { return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

async function send() {
  const text = $('input').value.trim();
  if (!text) return;
  $('input').value = '';
  addMsg('user', text, 'user');
  $('statusline').textContent = '思考中…';
  let mode = $('perm').value;
  let confirmation;
  if (mode === 'bypassPermissions') { confirmation = prompt('无限制模式可执行命令与改文件而不询问。输入 UNRESTRICTED 确认：'); if (confirmation !== 'UNRESTRICTED') { $('statusline').textContent = '已取消（未确认无限制模式）'; return; } }

  let assistantEl = null;
  let acc = '';
  try {
    const r = await fetch('/api/dialog/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt: text, permissionMode: mode, confirmation }),
    });
    if (!r.ok) { const err = (await r.json().catch(() => ({}))).error || '请求失败'; throw new Error(err); }
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const blocks = buf.split('\n\n'); buf = blocks.pop();
      for (const block of blocks) {
        const line = block.split('\n').find((l) => l.startsWith('data: '));
        if (!line) continue;
        let ev; try { ev = JSON.parse(line.slice(6)); } catch { continue; }
        if (ev.type === 'delta') {
          if (!assistantEl) { assistantEl = addMsg('assistant', ''); }
          acc += ev.text; assistantEl.textContent = acc;
        } else if (ev.type === 'message' && ev.role === 'assistant') {
          if (!assistantEl) { assistantEl = addMsg('assistant', ev.text); acc = ev.text; }
          else if (acc !== ev.text) { assistantEl.textContent = acc = ev.text; }
        } else if (ev.type === 'thinking') {
          $('statusline').textContent = '思考中…（有思考内容）';
        } else if (ev.type === 'tool') {
          $('statusline').textContent = `调用工具 ${ev.name}…`;
          const box = document.createElement('div');
          box.className = 'toolbox';
          box.innerHTML = `<div class="name">🔧 ${escapeHTML(ev.name)}</div><pre>${escapeHTML(JSON.stringify(ev.input, null, 2))}</pre>`;
          $('messages').appendChild(box);
        } else if (ev.type === 'tool_result') {
          $('statusline').textContent = `工具结果: ${ev.status}`;
        } else if (ev.type === 'approval') {
          pendingRequestId = ev.requestId;
          if (ev.tool === 'AskUserQuestion') showQuestions(ev.input?.questions || []);
          else showApproval(ev.tool, ev.input);
          await new Promise((res) => { window._resolveApproval = res; });
        } else if (ev.type === 'approval_resolved') {
          $('approval').style.display = 'none';
        } else if (ev.type === 'status') {
          $('statusline').textContent = ev.status;
        } else if (ev.type === 'result') {
          if (ev.error) { addMsg('error', ev.error, 'error'); $('statusline').textContent = '失败'; }
          else { $('statusline').textContent = `完成${ev.durationMs ? ' · ' + Math.round(ev.durationMs / 1000) + 's' : ''}`; }
          if (!acc) assistantEl?.remove();
        }
      }
    }
  } catch (e) {
    addMsg('error', e.message || '连接失败', 'error');
    $('statusline').textContent = '失败';
  }
  $('approval').style.display = 'none';
}

$('btnSend').addEventListener('click', send);
$('input').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
$('btnCancel').addEventListener('click', async () => { await postJSON('/api/dialog/cancel', {}); $('statusline').textContent = '已取消'; });
$('btnBack').addEventListener('click', () => { window.location.href = '/main.html'; });

$('btnAllow').addEventListener('click', async () => {
  if (!pendingRequestId) return;
  let answers;
  if (pendingTool === 'AskUserQuestion') {
    answers = {};
    for (const inp of answering) answers[inp.dataset.q] = inp.value;
  }
  const { j } = await postJSON('/api/dialog/approve', { requestId: pendingRequestId, approved: true, answers });
  if (j.ok !== true) { $('approvalMsg').textContent = j.error || '提交失败'; return; }
  $('approvalMsg').textContent = '';
  if (window._resolveApproval) { const r = window._resolveApproval; window._resolveApproval = null; r(); }
});
$('btnDeny').addEventListener('click', async () => {
  if (!pendingRequestId) return;
  await postJSON('/api/dialog/approve', { requestId: pendingRequestId, approved: false });
  $('approvalMsg').textContent = '';
  if (window._resolveApproval) { const r = window._resolveApproval; window._resolveApproval = null; r(); }
});

(async () => { if (!(await guard())) return; await loadInfo(); $('input').focus(); })();
</script>
</body>
</html>
